server.port=8080

# H2 file database (works out of the box, data kept in ./data)
spring.datasource.url=jdbc:h2:file:./data/farmconnect;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

# PostgreSQL (uncomment and remove the H2 lines above)
# spring.datasource.url=jdbc:postgresql://localhost:5432/farmconnect
# spring.datasource.username=postgres
# spring.datasource.password=postgres

# CHANGE THIS SECRET (min 32 characters)
app.jwt.secret=FarmConnectJwtSecretKey2026DevelopmentOnly123456789
app.jwt.expiration-ms=86400000
server.error.include-message=always