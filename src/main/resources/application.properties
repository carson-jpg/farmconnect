# spring.datasource.url=jdbc:postgresql://localhost:5432/farmconnect
# spring.datasource.username=postgres
# spring.datasource.password=postgres

# CHANGE THIS SECRET (min 32 characters)
app.jwt.secret=FarmConnectJwtSecretKey2026DevelopmentOnly123456789
app.jwt.expiration-ms=86400000

# ---- Farmer verification ----
# Where verification photos are stored (keep this folder private, add it to .gitignore)
app.upload-dir=./uploads
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=8MB

# Encrypts National ID numbers in the database. CHANGE IT and never lose it
# (if it changes, already-saved IDs can no longer be read).
app.crypto.key=change-this-encryption-secret-before-production

# SMS for phone OTP: "log" prints the code in this console (development).
# For real SMS use Africa's Talking:
#   app.sms.provider=africastalking
#   app.sms.at-username=YOUR_USERNAME   (sandbox for testing)
#   app.sms.at-api-key=YOUR_API_KEY
app.sms.provider=log

# First administrator (created on startup if missing). CHANGE THE PASSWORD.
app.admin.email=admin@farmconnect.local
app.admin.password=ChangeMe123!
app.admin.name=FarmConnect Admin