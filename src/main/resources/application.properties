# ---- Backups and alerts (switched on in application-prod.properties) ----
# Database + uploaded photos are copied here every night at 02:30; the newest 'keep' of each kind are kept.
app.backup.enabled=false
app.backup.dir=./backups
app.backup.keep=14
# app.backup.copy-to=/mnt/other-disk/farmconnect-backups
# The super admin is emailed when a backup fails, the disk is nearly full, the database is down or logins fail in bursts.
app.alerts.enabled=true
app.alerts.failed-logins=200

