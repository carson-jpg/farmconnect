# Production profile. Start the server with:  SPRING_PROFILES_ACTIVE=prod
# Every secret comes from an environment variable, never from this file.

# ---- Database: PostgreSQL (handles many users at once; H2 does not) ----
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Connections and threads: room for a burst of logins ----
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:30}
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=20000
server.tomcat.threads.max=${TOMCAT_THREADS:400}
server.tomcat.threads.min-spare=40
server.tomcat.accept-count=1000
server.tomcat.max-connections=10000
server.tomcat.connection-timeout=20s

# ---- Secrets (required) ----
app.jwt.secret=${JWT_SECRET}
app.crypto.key=${CRYPTO_KEY}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

# ---- Behaviour ----
server.compression.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.forward-headers-strategy=framework
server.error.include-message=always

# ---- Backups and alerts ----
app.backup.enabled=${BACKUP_ENABLED:true}
app.backup.dir=${BACKUP_DIR:/var/backups/farmconnect}
app.backup.copy-to=${BACKUP_COPY_TO:}
app.backup.keep=${BACKUP_KEEP:14}
app.alerts.failed-logins=${ALERT_FAILED_LOGINS:200}
